<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardião da Corrosão</title>
    <style>
        :root {
            --bg-game: #061121;
            --panel-bg: rgba(11, 31, 54, 0.85);
            --border-color: #285482;
            --text-color: #ffffff;
            --btn-bg: #112d4a;
            --btn-border: #24507d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        
        body {
            background-color: #050b14;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 100vw;
            max-width: 420px;
            height: 100vh;
            max-height: 840px;
            background-image: url('fundo1.png');
            background-size: cover;
            background-position: center;
            background-color: var(--bg-game);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            border: 4px solid #1c3b5e;
            overflow: hidden;
        }

        #vignette-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 3;
            box-shadow: inset 0 0 0 rgba(0, 0, 0, 0);
            transition: box-shadow 0.5s ease;
        }

        .particle {
            position: absolute;
            color: rgba(255, 255, 255, 0.35);
            font-size: 11px;
            pointer-events: none;
            user-select: none;
            z-index: 2;
            animation: riseParticle linear infinite;
        }
        @keyframes riseParticle {
            0% { transform: translateY(840px) scale(0.8); opacity: 0; }
            20% { opacity: 0.5; }
            80% { opacity: 0.5; }
            100% { transform: translateY(-50px) scale(1.2); opacity: 0; }
        }

        .edge-particle {
            position: absolute;
            color: rgba(150, 220, 255, 0.65);
            font-size: 10px;
            pointer-events: none;
            user-select: none;
            z-index: 2;
            text-shadow: 0 0 3px rgba(0, 150, 255, 0.5);
            animation: pulseEdge 2s ease-in-out infinite alternate;
        }
        @keyframes pulseEdge {
            0% { opacity: 0.4; transform: scale(0.95); }
            100% { opacity: 0.9; transform: scale(1.05); }
        }

        .top-panel { 
            display: flex; 
            flex-direction: column;
            gap: 8px; 
            z-index: 4; 
        }
        
        .top-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .status-box { 
            background: var(--panel-bg); 
            border: 1px solid var(--border-color); 
            padding: 6px; 
            width: 48%; 
            text-align: center; 
            color: var(--text-color); 
            font-size: 10px; 
            font-weight: bold; 
            border-radius: 4px; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        .status-box:hover { background: rgba(18, 50, 84, 0.95); }
        
        .bar-container { display: flex; gap: 4px; margin-top: 6px; justify-content: center; }
        .bar { width: 14px; height: 12px; background-color: #1c3b5e; border-radius: 2px; }
        .bar.active-green { background-color: #2ecc71; box-shadow: 0 0 5px #2ecc71; }
        .bar.active-blue { background-color: #3498db; box-shadow: 0 0 5px #3498db; }

        .counter-box-small {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px;
            color: var(--text-color);
            font-size: 11px;
            text-align: center;
            font-weight: bold;
            width: 48%;
        }

        .screen-area { text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 4; }
        
        .message-box { 
            background: rgba(0, 0, 0, 0.75); 
            color: #fff; 
            padding: 10px; 
            border-radius: 4px; 
            font-size: 12px; 
            margin-bottom: 20px; 
            width: 100%; 
            border: 1px solid var(--border-color); 
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        .message-box.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .pet-area { height: 250px; display: flex; justify-content: center; align-items: center; position: relative; width: 100%; }
        
        .pet-shadow {
            position: absolute;
            width: 130px;
            height: 40px;
            background: radial-gradient(ellipse at center, rgba(52, 152, 219, 0.5) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: 25px;
            border-radius: 50%;
            animation: shadowPulse 3s ease-in-out infinite;
            z-index: 1;
        }

        .pet-image { 
            max-width: 220px; 
            max-height: 220px; 
            width: auto;
            height: auto;
            object-fit: contain;
            animation: float 3s ease-in-out infinite; 
            transition: opacity 0.2s ease-in-out; 
            display: block;
            z-index: 2;
            filter: drop-shadow(0 0 12px rgba(46, 204, 113, 0.3));
        }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes shadowPulse { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(0.85); opacity: 0.2; } }

        .bottom-panel { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; z-index: 4; }
        .action-btn { background: var(--btn-bg); border: 1px solid var(--btn-border); padding: 12px 2px; color: white; font-size: 8px; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; border-radius: 4px; text-align: center; }
        .action-btn:active { transform: scale(0.95); background: #183759; }

        .sub-bottom-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
            z-index: 4;
        }
        .secondary-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 4px;
            padding: 10px 4px;
            color: white;
            font-size: 10px;
            text-align: center;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background 0.2s;
        }
        .secondary-btn:hover { background: #183759; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="vignette-overlay"></div>
        <div id="particles-container"></div>

        <div class="top-panel">
            <div class="top-row">
                <div class="status-box" onclick="mostrarInfoEstrutura()">
                    ESTRUTURA
                    <div class="bar-container" id="struct-bars"></div>
                </div>
                <div class="status-box" onclick="mostrarInfoEnergia()">
                    ENERGIA
                    <div class="bar-container" id="energy-bars"></div>
                </div>
            </div>
            <div class="top-row">
                <div class="counter-box-small">Íons Cl⁻: <span id="cl-count">128</span></div>
                <div class="counter-box-small">Dias Vivo: <span id="days-count">1</span></div>
            </div>
        </div>

        <div class="screen-area">
            <div class="message-box" id="game-msg">O Guardião está pronto para blindar o metal!</div>
            <div class="pet-area">
                <div class="pet-shadow"></div>
                <img src="imagens_pet_neutro.png" alt="Pet Guardião" class="pet-image" id="pet-graphic" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'150\' height=\'150\'><text x=\'10\' y=\'80\' font-size=\'14\' fill=\'white\'>Erro de Imagem</text></svg>';">
            </div>
        </div>

        <div>
            <div class="bottom-panel">
                <button class="action-btn" onclick="interagir('feliz', 'Adorei o carinho! Energia restaurada.')">❤️<br>CARINHO</button>
                <button class="action-btn" onclick="interagir('determinado', 'Íons absorvidos! Blindagem reforçada.')">🧪<br>ALIMENTAR</button>
                <button class="action-btn" onclick="interagir('limpar', 'Ambiente higienizado e livre de impurezas!')">💧<br>LIMPAR</button>
                <button class="action-btn" onclick="interagir('coletar', 'Coleta realizada: 2 itens de íons Cl⁻ obtidos!')">⚛️<br>COLETAR</button>
                <button class="action-btn" onclick="interagir('sonolento', 'Modo de repouso ativado...')">💤<br>DORMIR</button>
            </div>
            
            <div class="sub-bottom-panel">
                <button class="secondary-btn" onclick="mudarTema()">🎨 Tema do Game</button>
                <button class="secondary-btn" onclick="mostrarInfoGeral()">ℹ️ Informação</button>
            </div>
        </div>
    </div>

    <script>
        let jogo = { 
            estrutura: 7, 
            energia: 7, 
            cloreto: 128, 
            temaIndex: 0,
            dataCriacao: null,
            ultimaInteracao: null,
            ultimaLimpeza: null,
            limpezasHoje: 0,
            dataUltimaContagemLimpeza: null
        };

        let msgTimeout = null;

        const expressoes = {
            "preocupado": "imagens_pet_preocupado.png",
            "determinado": "imagens_pet_determinado.png",
            "desconfiado": "imagens_pet_desconfiado.png",
            "triste": "imagens_pet_triste.png",
            "furioso": "imagens_pet_furioso.png",
            "admirado": "imagens_pet_admirado.png",
            "neutro": "imagens_pet_neutro.png",
            "feliz": "imagens_pet_feliz.png",
            "apavorado": "imagens_pet_apavorado.png",
            "doente": "imagens_pet_doente.png",
            "sonolento": "imagens_pet_sonolento.png"
        };

        const fundos = ["fundo1.png", "fundo2.png", "fundo3.png", "fundo4.png"];

        function exibirMensagem(texto) {
            const msgBox = document.getElementById('game-msg');
            msgBox.innerText = texto;
            msgBox.classList.remove('hidden');

            if (msgTimeout) clearTimeout(msgTimeout);
            msgTimeout = setTimeout(() => {
                msgBox.classList.add('hidden');
            }, 10000);
        }

        function gerenciarParticulas() {
            const container = document.getElementById('particles-container');
            container.innerHTML = '';
            
            let agora = new Date().getTime();
            if (!jogo.ultimaLimpeza) jogo.ultimaLimpeza = agora;
            let horasSemLimpar = (agora - jogo.ultimaLimpeza) / (1000 * 60 * 60);

            if (horasSemLimpar > 12) {
                let qtdParticulas = Math.min(40, Math.floor(jogo.cloreto / 5));
                for (let i = 0; i < qtdParticulas; i++) {
                    let p = document.createElement('div');
                    p.className = 'edge-particle';
                    p.innerText = 'Cl⁻';
                    
                    let lado = Math.random();
                    if (lado < 0.25) {
                        p.style.left = (Math.random() * 35) + 'px';
                        p.style.top = (Math.random() * 750) + 'px';
                    } else if (lado < 0.5) {
                        p.style.right = (Math.random() * 35) + 'px';
                        p.style.top = (Math.random() * 750) + 'px';
                    } else if (lado < 0.75) {
                        p.style.left = (Math.random() * 380) + 'px';
                        p.style.top = (Math.random() * 60) + 'px';
                    } else {
                        p.style.left = (Math.random() * 380) + 'px';
                        p.style.bottom = (Math.random() * 120) + 'px';
                    }
                    container.appendChild(p);
                }
            } else {
                for (let i = 0; i < 12; i++) {
                    let p = document.createElement('div');
                    p.className = 'particle';
                    p.innerText = Math.random() > 0.5 ? 'Cl⁻' : '•';
                    p.style.left = Math.random() * 380 + 'px';
                    p.style.animationDuration = (Math.random() * 4 + 3) + 's';
                    p.style.animationDelay = (Math.random() * 5) + 's';
                    container.appendChild(p);
                }
            }
        }

        function atualizarVinhetaEPassagemTempo() {
            let agora = new Date().getTime();
            if (!jogo.ultimaLimpeza) jogo.ultimaLimpeza = agora;

            let horasSemLimpar = (agora - jogo.ultimaLimpeza) / (1000 * 60 * 60);
            let vignette = document.getElementById('vignette-overlay');

            if (horasSemLimpar > 12) {
                let fatorIntensidade = Math.min(150, Math.floor((horasSemLimpar - 12) * 15));
                vignette.style.boxShadow = `inset 0 0 ${fatorIntensidade}px rgba(0, 0, 0, 0.85)`;
            } else {
                vignette.style.boxShadow = `inset 0 0 0 rgba(0, 0, 0, 0)`;
            }
        }

        function salvarProgresso() {
            localStorage.setItem('corrosao_pet_save', JSON.stringify(jogo));
        }

        function carregarProgresso() {
            let salvo = localStorage.getItem('corrosao_pet_save');
            let agora = new Date().getTime();
            
            if (salvo) {
                jogo = JSON.parse(salvo);
                
                let dataUltima = new Date(jogo.dataUltimaContagemLimpeza || agora).toDateString();
                let dataAtualStr = new Date(agora).toDateString();
                if (dataUltima !== dataAtualStr) {
                    jogo.limpezasHoje = 0;
                    jogo.dataUltimaContagemLimpeza = agora;
                }

                let diferencaHoras = (agora - jogo.ultimaInteracao) / (1000 * 60 * 60);
                if (diferencaHoras > 12) {
                    jogo.energia = Math.max(1, jogo.energia - Math.floor(diferencaHoras / 12));
                    jogo.cloreto += Math.floor(diferencaHoras * 3);
                }
            } else {
                jogo.dataCriacao = agora;
                jogo.ultimaLimpeza = agora;
                jogo.dataUltimaContagemLimpeza = agora;
            }
            jogo.ultimaInteracao = agora;
            salvarProgresso();
        }

        function calcularDiasVivo() {
            if (!jogo.dataCriacao) return 1;
            let diffTime = Math.abs(new Date().getTime() - jogo.dataCriacao);
            let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return Math.max(1, diffDays);
        }

        function interagir(tipo, msg) {
            exibirMensagem(msg);
            const imgElement = document.getElementById('pet-graphic');
            
            let expressaoAlvo = "neutro";
            if(tipo === 'feliz') expressaoAlvo = "feliz";
            if(tipo === 'determinado') expressaoAlvo = "determinado";
            if(tipo === 'limpar') {
                expressaoAlvo = "admirado";
                jogo.ultimaLimpeza = new Date().getTime();
                jogo.limpezasHoje++;
                jogo.cloreto = Math.max(0, jogo.cloreto - 10);
            }
            if(tipo === 'coletar') {
                expressaoAlvo = "determinado";
                jogo.cloreto = Math.max(0, jogo.cloreto - 2);
            }
            if(tipo === 'sonolento') expressaoAlvo = "sonolento";

            if (expressoes[expressaoAlvo]) {
                imgElement.src = expressoes[expressaoAlvo];
            }

            if(tipo === 'feliz' || tipo === 'determinado') {
                jogo.energia = Math.min(7, jogo.energia + 1);
                jogo.cloreto = Math.max(0, jogo.cloreto - 5);
            }
            if(tipo === 'sonolento') {
                jogo.energia = 7;
                imgElement.src = expressoes["sonolento"];
            }

            jogo.ultimaInteracao = new Date().getTime();
            atualizarTela();
        }

        function avaliarHumorAutomatico() {
            const imgElement = document.getElementById('pet-graphic');
            let agora = new Date().getTime();
            let horasSemLimpar = (agora - jogo.ultimaLimpeza) / (1000 * 60 * 60);
            
            let expr = "neutro";
            
            if (jogo.energia <= 1) {
                expr = "doente";
            } else if (horasSemLimpar > 18) {
                expr = "apavorado";
            } else if (horasSemLimpar > 12) {
                expr = "preocupado";
            } else if (jogo.cloreto > 180) {
                expr = "furioso";
            } else if (jogo.cloreto > 120) {
                expr = "desconfiado";
            } else if (jogo.estrutura <= 2) {
                expr = "triste";
            }
            
            if(expr !== "neutro") {
                imgElement.src = expressoes[expr];
            }
        }

        function atualizarBarras() {
            const struct = document.getElementById('struct-bars');
            const energy = document.getElementById('energy-bars');
            struct.innerHTML = ''; 
            energy.innerHTML = '';
            
            for(let i = 0; i < 7; i++) {
                let b = document.createElement('div'); 
                b.className = 'bar';
                if(i < jogo.estrutura) b.classList.add('active-green');
                struct.appendChild(b);
            }
            
            for(let i = 0; i < 7; i++) {
                let b = document.createElement('div'); 
                b.className = 'bar';
                if(i < jogo.energia) b.classList.add('active-blue');
                energy.appendChild(b);
            }
        }

        function atualizarTela() {
            let agora = new Date().getTime();
            if (!jogo.ultimaLimpeza) jogo.ultimaLimpeza = agora;
            let horasSemLimpar = (agora - jogo.ultimaLimpeza) / (1000 * 60 * 60);

            // Lógica dinâmica da Estrutura integrada
            if (horasSemLimpar > 12 || jogo.cloreto > 150) {
                jogo.estrutura = Math.max(1, jogo.estrutura - 1);
            } else if (jogo.energia >= 6 && jogo.cloreto < 50) {
                jogo.estrutura = Math.min(7, jogo.estrutura + 1);
            }

            document.getElementById('cl-count').innerText = jogo.cloreto;
            document.getElementById('days-count').innerText = calcularDiasVivo();
            atualizarBarras();
            atualizarVinhetaEPassagemTempo();
            gerarParticulas();
            avaliarHumorAutomatico();
            salvarProgresso();
        }

        function mostrarInfoEstrutura() {
            exibirMensagem("ESTRUTURA: Mede a integridade física do metal protegido contra a corrosão.");
        }

        function mostrarInfoEnergia() {
            exibirMensagem("ENERGIA: Representa a disposição do Guardião para realizar bio-remediação.");
        }

        function mostrarInfoGeral() {
            exibirMensagem(`Contexto Químico: Íons Cl⁻ geram corrosão marinha. Limpezas hoje: ${jogo.limpezasHoje}/5.`);
        }

        function mudarTema() {
            jogo.temaIndex = (jogo.temaIndex + 1) % fundos.length;
            let fundoAtual = fundos[jogo.temaIndex];
            document.getElementById('game-container').style.backgroundImage = `url('${fundoAtual}')`;
            exibirMensagem("Fundo alterado para: " + fundoAtual);
            salvarProgresso();
        }

        carregarProgresso();
        atualizarTela();
        
        setInterval(() => {
            atualizarVinhetaEPassagemTempo();
        }, 30000);
    </script>
</body>
</html>
