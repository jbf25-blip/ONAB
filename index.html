<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ONAB - Guardião da Corrosão</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#061121">
    <link rel="apple-touch-icon" href="imagens_pet_neutro.png">

    <style>
        :root {
            --bg-game: #061121;
            --panel-bg: rgba(11, 31, 54, 0.95);
            --border-color: #285482;
            --text-color: #ffffff;
            --btn-bg: #112d4a;
            --btn-border: #386fa4;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #050b14;
        }

        #game-container {
            width: 100%;
            height: 100%;
            background-image: url('fundo1.png');
            background-size: cover;
            background-position: center;
            background-color: var(--bg-game);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            overflow: hidden;
        }

        #vignette-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 3;
            box-shadow: inset 0 0 0 rgba(0, 0, 0, 0);
            transition: box-shadow 0.5s ease;
        }

        #shield-flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(72,219,251,0.6) 0%, rgba(0,0,0,0) 70%);
            opacity: 0;
            pointer-events: none;
            z-index: 25;
            transition: opacity 0.3s ease;
        }
        #shield-flash.active { opacity: 1; }

        .particle {
            position: absolute;
            color: rgba(255, 255, 255, 0.35);
            font-size: 14px;
            pointer-events: none;
            z-index: 2;
            animation: riseParticle linear infinite;
        }
        @keyframes riseParticle {
            0% { transform: translateY(100vh) scale(0.8); opacity: 0; }
            20% { opacity: 0.5; }
            80% { opacity: 0.5; }
            100% { transform: translateY(-50px) scale(1.2); opacity: 0; }
        }

        .edge-particle {
            position: absolute;
            color: rgba(150, 220, 255, 0.65);
            font-size: 14px;
            pointer-events: none;
            z-index: 2;
            text-shadow: 0 0 3px rgba(0, 150, 255, 0.5);
            animation: pulseEdge 2s ease-in-out infinite alternate;
        }
        @keyframes pulseEdge {
            0% { opacity: 0.4; transform: scale(0.95); }
            100% { opacity: 0.9; transform: scale(1.05); }
        }

        .heart-particle {
            position: absolute;
            color: #e84393;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            z-index: 20;
            animation: floatHeart 1.2s ease-out forwards;
        }
        @keyframes floatHeart {
            0% { transform: translateY(0) scale(0.6); opacity: 1; }
            100% { transform: translateY(-70px) scale(1.3); opacity: 0; }
        }

        .floating-feedback {
            position: absolute;
            color: #48dbfb;
            font-size: 16px;
            font-weight: bold;
            pointer-events: none;
            z-index: 30;
            text-shadow: 0 0 4px rgba(0,0,0,0.8);
            animation: floatFeedback 1s ease-out forwards;
        }
        @keyframes floatFeedback {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            100% { transform: translateY(-40px) scale(1.2); opacity: 0; }
        }

        .top-panel { 
            display: flex; 
            flex-direction: column;
            gap: 6px; 
            z-index: 4; 
            width: 100%;
            flex-shrink: 0;
        }
        
        .top-row {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            align-items: center;
        }

        .status-box { 
            background: var(--panel-bg); 
            border: 1.5px solid var(--border-color); 
            padding: 8px 4px; 
            flex: 1;
            text-align: center; 
            color: var(--text-color); 
            font-size: 12px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
        }
        
        .bar-container { display: flex; gap: 3px; margin-top: 4px; justify-content: center; }
        .bar { flex: 1; max-width: 16px; height: 12px; background-color: #1c3b5e; border-radius: 3px; }
        .bar.active-green { background-color: #2ecc71; box-shadow: 0 0 4px #2ecc71; }
        .bar.active-blue { background-color: #3498db; box-shadow: 0 0 4px #3498db; }
        .bar.active-pink { background-color: #e84393; box-shadow: 0 0 4px #e84393; }

        .counter-box-small {
            background: var(--panel-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            color: var(--text-color);
            font-size: 13px;
            text-align: center;
            font-weight: bold;
            flex: 1;
        }

        .ecg-container {
            background: var(--panel-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 10px;
            width: 100%;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .ecg-label {
            font-size: 12px;
            color: #48dbfb;
            font-weight: bold;
        }
        #ecg-svg {
            width: 65%;
            height: 22px;
        }

        .screen-area { 
            text-align: center; 
            flex: 1;
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 4; 
            position: relative; 
            width: 100%;
            padding: 8px 0;
            min-height: 0;
        }
        
        .message-box { 
            background: rgba(0, 0, 0, 0.88); 
            color: #48dbfb; 
            padding: 10px 14px; 
            border-radius: 8px; 
            font-size: 14px; 
            font-weight: 500;
            width: 100%; 
            border: 1.5px solid var(--border-color); 
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.3;
            flex-shrink: 0;
        }
        
        .pet-area { 
            flex: 1;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: relative; 
            width: 100%; 
            min-height: 0;
        }
        
        .pet-shadow {
            position: absolute;
            width: 160px;
            height: 35px;
            background: radial-gradient(ellipse at center, rgba(52, 152, 219, 0.5) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: 5px;
            border-radius: 50%;
            z-index: 1;
        }

        .pet-image { 
            max-width: 90%; 
            max-height: 100%; 
            object-fit: contain;
            animation: float 3s ease-in-out infinite; 
            z-index: 2;
            cursor: pointer;
            filter: drop-shadow(0 0 12px rgba(46, 204, 113, 0.3));
        }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .controls-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 4;
            width: 100%;
            flex-shrink: 0;
        }

        .bottom-panel { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 6px; 
        }

        .action-btn { 
            background: var(--btn-bg); 
            border: 1.5px solid var(--btn-border); 
            padding: 12px 2px; 
            color: white; 
            font-size: 11px; 
            font-weight: bold; 
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            border-radius: 8px; 
            text-align: center; 
            line-height: 1.2;
        }
        .action-btn:active { transform: scale(0.95); background: #183759; }

        .sub-bottom-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        
        .secondary-btn {
            background: var(--btn-bg);
            border: 1.5px solid var(--btn-border);
            border-radius: 8px;
            padding: 12px 2px;
            color: white;
            font-size: 12px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
        }

        .active-ion {
            position: absolute;
            width: 44px;
            height: 44px;
            background: radial-gradient(circle, #ff7675 0%, #d63031 100%);
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: white;
            font-weight: bold;
            box-shadow: 0 0 10px #ff7675;
        }

        #modal-sobre {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 10, 20, 0.98);
            z-index: 100;
            display: none;
            flex-direction: column;
            padding: 16px;
            justify-content: space-between;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1.5px solid var(--border-color);
            padding-bottom: 10px;
        }
        .modal-header h2 { font-size: 16px; color: #48dbfb; }
        .close-modal-btn {
            background: #c0392b;
            border: none;
            color: white;
            padding: 8px 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
        }
        .modal-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 12px 0;
        }
        .modal-tab-btn {
            background: var(--btn-bg);
            border: 1.5px solid var(--border-color);
            padding: 12px;
            color: white;
            font-size: 13px;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .modal-content-box {
            background: rgba(10, 25, 45, 0.9);
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            flex-grow: 1;
            margin-top: 5px;
            overflow-y: auto;
            font-size: 13px;
            color: #dcdde1;
            line-height: 1.5;
        }
        .modal-content-box h3 { color: #feca57; margin-bottom: 8px; font-size: 15px; }
        .author-sign {
            text-align: center;
            font-size: 12px;
            color: #74b9ff;
            margin-top: 10px;
            font-weight: bold;
            border-top: 1px dashed var(--border-color);
            padding-top: 8px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="vignette-overlay"></div>
        <div id="shield-flash"></div>
        <div id="particles-container"></div>

        <div class="top-panel">
            <div class="top-row">
                <div class="status-box" onclick="mostrarInfoStatus('estrutura')">
                    ESTRUTURA
                    <div class="bar-container" id="struct-bars"></div>
                </div>
                <div class="status-box" onclick="mostrarInfoStatus('energia')">
                    ENERGIA
                    <div class="bar-container" id="energy-bars"></div>
                </div>
                <div class="status-box" onclick="mostrarInfoStatus('vinculo')">
                    VÍNCULO
                    <div class="bar-container" id="bond-bars"></div>
                </div>
            </div>
            <div class="top-row">
                <div class="counter-box-small">Íons Cl⁻: <span id="cl-count">128</span></div>
                <div class="counter-box-small">Dias Vivo: <span id="days-count">1</span></div>
            </div>
            <div class="ecg-container">
                <span class="ecg-label">BIO-FREQ</span>
                <svg id="ecg-svg" viewBox="0 0 140 16">
                    <path id="ecg-path" d="M0,8 L20,8 L25,2 L30,14 L35,8 L60,8 L65,0 L72,16 L78,8 L100,8 L105,4 L110,12 L115,8 L140,8" fill="none" stroke="#2ecc71" stroke-width="2" />
                </svg>
            </div>
        </div>

        <div class="screen-area" id="main-screen-area">
            <div class="message-box" id="game-msg">ONAB inicializado. Sistema pronto para blindagem.</div>
            <div class="pet-area" id="pet-wrapper">
                <div class="pet-shadow"></div>
                <img src="imagens_pet_neutro.png" alt="Pet Guardião" class="pet-image" id="pet-graphic">
            </div>
        </div>

        <div class="controls-wrapper">
            <div class="bottom-panel">
                <button class="action-btn" onclick="interagir('limpar', 'Ambiente higienizado e parasitas removidos!')"><span style="font-size:16px;">💧</span>LIMPAR</button>
                <button class="action-btn" onclick="interagir('determinado', 'Alimentado com inibidores anticorrosivos.')"><span style="font-size:16px;">🧪</span>ALIMENTAR</button>
                <button class="action-btn" onclick="interagir('feliz', 'Carinho aplicado! Vínculo e energia elevados.')"><span style="font-size:16px;">❤️</span>CARINHO</button>
                <button class="action-btn" onclick="iniciarMinigame()"><span style="font-size:16px;">⚛️</span>COLETAR</button>
                <button class="action-btn" onclick="interagir('sonolento', 'Modo de repouso noturno ativado.')"><span style="font-size:16px;">💤</span>DORMIR</button>
            </div>
            
            <div class="sub-bottom-panel">
                <button class="secondary-btn" onclick="mudarTema()">🎨 Tema</button>
                <button class="secondary-btn" onclick="iniciarExpedicao()">🧭 Expedição</button>
                <button class="secondary-btn" onclick="alternarNoite()">🌙 Luzes</button>
                <button class="secondary-btn" onclick="abrirModalSobre()" style="background: #1b4f72; border-color: #3498db;">ℹ️ Sobre</button>
            </div>
        </div>

        <div id="modal-sobre">
            <div class="modal-header">
                <h2>CENTRAL INFORMATIVA ONAB</h2>
                <button class="close-modal-btn" onclick="fecharModalSobre()">X</button>
            </div>
            <div class="modal-menu">
                <button class="modal-tab-btn" onclick="carregarConteudoModal('historia')">📖 1. A História e o Objetivo Lúdico</button>
                <button class="modal-tab-btn" onclick="carregarConteudoModal('interdisciplinaridade')">🔬 2. Interdisciplinaridade no Ensino Médio</button>
                <button class="modal-tab-btn" onclick="carregarConteudoModal('criador')">👨‍🏫 3. Sobre o Criador e Prática Pedagógica</button>
            </div>
            <div class="modal-content-box" id="modal-text-content">
                <h3>Bem-vindo à Central Informativa!</h3>
                <p>Selecione uma das opções acima para explorar a imersão lúdica e os conceitos científicos integrados.</p>
            </div>
            <div class="author-sign">Criado por: Barros AJS</div>
        </div>
    </div>

    <script>
        let jogo = { 
            estrutura: 7, 
            energia: 7, 
            vinculo: 3,
            cloreto: 128, 
            temaIndex: 0,
            isNight: false,
            dataCriacao: null,
            ultimaInteracao: null
        };

        const expressoes = {
            "preocupado": "imagens_pet_preocupado.png",
            "determinado": "imagens_pet_determinado.png",
            "desconfiado": "imagens_pet_desconfiado.png",
            "triste": "imagens_pet_triste.png",
            "furioso": "imagens_pet_furioso.png",
            "admirado": "imagens_pet_admirado.png",
            "neutro": "imagens_pet_neutro.png",
            "feliz": "imagens_pet_feliz.png",
            "apavorado": "imagens_pet_apavorado.png",
            "doente": "imagens_pet_doente.png",
            "sonolento": "imagens_pet_sonolento.png"
        };

        const fundos = ["fundo1.png", "fundo2.png", "fundo3.png", "fundo4.png"];

        function exibirMensagem(texto) {
            document.getElementById('game-msg').innerText = texto;
        }

        function salvarProgresso() {
            localStorage.setItem('onab_save_v12', JSON.stringify(jogo));
        }

        function carregarProgresso() {
            let salvo = localStorage.getItem('onab_save_v12');
            if (salvo) jogo = JSON.parse(salvo);
            else jogo.dataCriacao = new Date().getTime();
            document.getElementById('game-container').style.backgroundImage = `url('${fundos[jogo.temaIndex]}')`;
        }

        function atualizarBarras() {
            const struct = document.getElementById('struct-bars');
            const energy = document.getElementById('energy-bars');
            const bond = document.getElementById('bond-bars');
            struct.innerHTML = ''; energy.innerHTML = ''; bond.innerHTML = '';
            
            for(let i = 0; i < 7; i++) {
                let b = document.createElement('div');
                b.className = 'bar';
                if(i < jogo.estrutura) b.classList.add('active-green');
                struct.appendChild(b);
            }
            for(let i = 0; i < 7; i++) {
                let b = document.createElement('div');
                b.className = 'bar';
                if(i < jogo.energia) b.classList.add('active-blue');
                energy.appendChild(b);
            }
            for(let i = 0; i < 7; i++) {
                let b = document.createElement('div');
                b.className = 'bar';
                if(i < jogo.vinculo) b.classList.add('active-pink');
                bond.appendChild(b);
            }
        }

        function atualizarTela() {
            document.getElementById('cl-count').innerText = jogo.cloreto;
            document.getElementById('days-count').innerText = Math.max(1, Math.ceil((new Date().getTime() - (jogo.dataCriacao || new Date().getTime())) / (1000 * 60 * 60 * 24)));
            atualizarBarras();
            salvarProgresso();
        }

        function interagir(tipo, msg) {
            exibirMensagem(msg);
            const img = document.getElementById('pet-graphic');
            if (tipo === 'feliz') { jogo.vinculo = Math.min(7, jogo.vinculo + 1); img.src = expressoes['feliz']; }
            if (tipo === 'determinado') { jogo.energia = Math.min(7, jogo.energia + 1); img.src = expressoes['determinado']; }
            if (tipo === 'limpar') { jogo.cloreto = Math.max(0, jogo.cloreto - 15); img.src = expressoes['admirado']; }
            if (tipo === 'sonolento') { jogo.energia = 7; img.src = expressoes['sonolento']; }
            atualizarTela();
        }

        function mudarTema() {
            jogo.temaIndex = (jogo.temaIndex + 1) % fundos.length;
            document.getElementById('game-container').style.backgroundImage = `url('${fundos[jogo.temaIndex]}')`;
            exibirMensagem("Ambiente de laboratório atualizado!");
            salvarProgresso();
        }

        function iniciarMinigame() {
            exibirMensagem("Toque nos íons de cloreto para neutralizá-los!");
            const area = document.getElementById('main-screen-area');
            for(let i=0; i<3; i++) {
                let ion = document.createElement('div');
                ion.className = 'active-ion';
                ion.innerText = 'Cl⁻';
                ion.style.left = (20 + Math.random() * 60) + '%';
                ion.style.top = (30 + Math.random() * 40) + '%';
                ion.onclick = function() {
                    jogo.cloreto = Math.max(0, jogo.cloreto - 5);
                    ion.remove();
                    atualizarTela();
                };
                area.appendChild(ion);
                setTimeout(() => { if(ion.parentElement) ion.remove(); }, 3000);
            }
        }

        function iniciarExpedicao() {
            exibirMensagem("Expedição realizada! Amostras coletadas.");
            jogo.cloreto = Math.max(0, jogo.cloreto - 10);
            atualizarTela();
        }

        function alternarNoite() {
            jogo.isNight = !jogo.isNight;
            exibirMensagem(jogo.isNight ? "Modo Noturno ativado." : "Modo Diurno ativado.");
        }

        function abrirModalSobre() { document.getElementById('modal-sobre').style.display = 'flex'; }
        function fecharModalSobre() { document.getElementById('modal-sobre').style.display = 'none'; }
        
        function carregarConteudoModal(secao) {
            const caixa = document.getElementById('modal-text-content');
            if (secao === 'historia') caixa.innerHTML = "<h3>História do ONAB</h3><p>O Guardião da Corrosão atua em ruínas subaquáticas protegendo o ecossistema marinho de íons nocivos.</p>";
            if (secao === 'interdisciplinaridade') caixa.innerHTML = "<h3>Conceitos Científicos</h3><p>Aplica reações de oxirredução, inibidores verdes e ecologia marinha na prática pedagógica.</p>";
            if (secao === 'criador') caixa.innerHTML = "<h3>Sobre o Criador</h3><p>Desenvolvido por Barros AJS para promover o ensino ativo de Química e Matemática.</p>";
        }

        function mostrarInfoStatus(tipo) {
            if(tipo === 'estrutura') exibirMensagem("ESTRUTURA: Integridade do metal.");
            if(tipo === 'energia') exibirMensagem("ENERGIA: Nível operacional.");
            if(tipo === 'vinculo') exibirMensagem("VÍNCULO: Nível de afinidade.");
        }

        carregarProgresso();
        atualizarTela();
    </script>
</body>
</html>
